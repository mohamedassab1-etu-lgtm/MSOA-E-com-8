server.port=8082
spring.application.name=catalog-service
spring.datasource.url=jdbc:sqlite:data/catalog.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=never
cors.allowed-origins=http://localhost:5173,http://localhost:8083
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[max.block.ms]=2000
spring.kafka.producer.properties[request.timeout.ms]=2000
spring.kafka.producer.properties[delivery.timeout.ms]=5000
catalog.kafka.topic=catalog-events
catalog.kafka.enabled=true