
syntax = "proto3";

package inventory;

service InventoryService {
  rpc GetStock (StockRequest) returns (StockResponse);
  rpc CheckAvailability (ItemsRequest) returns (AvailabilityResponse);
  rpc ReserveStock (ItemsRequest) returns (OperationResponse);
  rpc ReleaseStock (ItemsRequest) returns (OperationResponse);
}

message StockRequest {
  int32 product_id = 1;
}

message StockResponse {
  int32 product_id = 1;
  int32 stock = 2;
}

message Item {
  int32 product_id = 1;
  int32 quantity = 2;
}

message ItemsRequest {
  repeated Item items = 1;
}

message AvailabilityResponse {
  bool available = 1;
}

message OperationResponse {
  bool success = 1;
}
